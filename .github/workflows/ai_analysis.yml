name: AI 分析与推送（开奖前1小时）

on:
  schedule:
    # 双色球：周二、周四、周日 20:15（北京时间）= 12:15 UTC
    - cron: '15 12 * * 2,4,0'
    # 大乐透：周一、周三、周六 19:30（北京时间）= 11:30 UTC
    - cron: '30 11 * * 1,3,6'
  workflow_dispatch:
    inputs:
      lottery:
        description: '彩种'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'ssq', 'dlt']

jobs:
  analyze-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -q pandas numpy requests beautifulsoup4 lxml

      - name: 运行 AI 分析与推送
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          LOTTERY="${{ github.event.inputs.lottery || 'all' }}"
          echo "运行彩种: $LOTTERY"
          python run_analysis.py --lottery "$LOTTERY"

      - name: 提交报告和数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ data/reports/
          git diff --staged --quiet || git commit -m "AI分析报告 $(date +'%Y-%m-%d %H:%M')"
          git push
