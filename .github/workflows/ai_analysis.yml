name: AI 分析与推送（开奖前1小时）
on:
  schedule:
    # 大乐透/排列三/排列五：每天 19:30（北京时间）= 11:30 UTC
    - cron: '30 11 * * *'
    # 双色球/福彩3D：每天 20:15（北京时间）= 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      lottery:
        description: '彩种'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'ssq', 'dlt', 'fc3d', 'pl3', 'pl5']
jobs:
  analyze-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          pip install -q pandas numpy requests beautifulsoup4 lxml
      - name: 运行 AI 分析与推送
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          LOTTERY="${{ github.event.inputs.lottery || 'all' }}"
          echo "运行彩种: $LOTTERY"
          python run_analysis.py --lottery "$LOTTERY"
      - name: 提交报告和数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ data/reports/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "AI分析报告 $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
